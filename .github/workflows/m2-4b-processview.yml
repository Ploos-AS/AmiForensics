name: M2.4b ProcessView qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  processview-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip
      - name: Gate 1 - native ProcessView build with pinned Bebbo toolchain
        run: bash ci/fs-uae/build-native-processview.sh
      - name: Gate 2 - execute ProcessView in AROS guest
        run: bash ci/fs-uae/run-aros-processview.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-4b-processview-qualification
          path: |
            build/fs-uae/native-processview/ProcessView
            build/fs-uae/native-processview/ProcessView.sha256
            build/fs-uae/native-processview/file.txt
            build/fs-uae/native-processview/result.txt
            build/fs-uae/native-processview/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-processview/result.txt
            build/fs-uae/aros-processview/fs-uae.log
            build/fs-uae/aros-processview/fs-uae-version.txt
            build/fs-uae/aros-processview/aros-processview.fs-uae
