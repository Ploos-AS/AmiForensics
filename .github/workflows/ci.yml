name: ci

on:
  push:
  pull_request:

jobs:
  static-tools-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host smoke binaries
        run: make clean && make CC=gcc CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-function'
      - name: Static checks
        run: make check
      - name: Exercise FileInfo human output
        shell: bash
        run: |
          printf '\x00\x00\x03\xF3test' > hunk.bin
          ./FileInfo hunk.bin | tee output.txt
          grep -F 'Size: 8 bytes' output.txt
          grep -F 'Type: amiga-hunk' output.txt
          grep -E '^CRC32: [0-9A-F]{8}$' output.txt
          grep -E '^SHA256: [0-9a-f]{64}$' output.txt
          grep -E '^Byte diversity: [0-9]+/256$' output.txt
          grep -E '^Packed/compressed hint: (low|possible|high)$' output.txt
      - name: Exercise FileInfo structured output
        shell: bash
        run: |
          expected="$(sha256sum hunk.bin | awk '{print $1}')"
          ./FileInfo --kv hunk.bin | tee kv.txt
          grep -F 'type=amiga-hunk' kv.txt
          grep -F "sha256=${expected}" kv.txt
          grep -E '^crc32=[0-9A-F]{8}$' kv.txt
          grep -E '^byte_diversity=[0-9]+$' kv.txt
          grep -E '^packed_hint=(low|possible|high)$' kv.txt
      - name: Exercise Strings
        shell: bash
        run: |
          printf 'noise\0exec.library\0trackdisk.device\0S:Startup-Sequence\0http://example.invalid/x\0REXXMAST\0' > strings.bin
          ./Strings strings.bin | tee strings.txt
          grep -F 'library' strings.txt
          grep -F 'trackdisk.device' strings.txt
          grep -F 'amiga-path-or-port' strings.txt
          grep -F 'network' strings.txt
          grep -F 'arexx' strings.txt
          ./Strings --indicators strings.bin | tee indicators.txt
          ! grep -F 'noise' indicators.txt
          grep -F 'exec.library' indicators.txt
      - name: Exercise HunkInfo
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          words = [1011,0,1,0,0,1,1001,1,0x4E714E75,1004,1,0,0,0,1008,1,0x54455354,0,0,1009,1,0,1010]
          with open('valid.hunk', 'wb') as f:
              for w in words: f.write(struct.pack('>I', w))
          with open('truncated.hunk', 'wb') as f: f.write(struct.pack('>II', 1011, 0))
          PY
          ./HunkInfo valid.hunk | tee hunkinfo.txt
          grep -F 'Header: HUNK_HEADER' hunkinfo.txt
          grep -F 'CODE bytes: 4' hunkinfo.txt
          grep -F 'RELOC32 entries: 1' hunkinfo.txt
          grep -F 'Symbols: 1' hunkinfo.txt
          grep -F 'DEBUG hunks: 1' hunkinfo.txt
          ! ./HunkInfo truncated.hunk
      - name: Exercise BootInfo
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          data = bytearray(1024)
          data[0:4] = b'DOS\x00'
          data[8:12] = struct.pack('>I', 880)
          marker = b'trackdisk.device\x00exec.library\x00'
          data[12:12+len(marker)] = marker
          def add_end_around(sum_, value):
              total = sum_ + value
              return (total & 0xffffffff) + (1 if total > 0xffffffff else 0)
          s = 0
          for off in range(0, 1024, 4):
              value = 0 if off == 4 else struct.unpack('>I', data[off:off+4])[0]
              s = add_end_around(s, value)
          data[4:8] = struct.pack('>I', (~s) & 0xffffffff)
          open('bootblock.bin', 'wb').write(data)
          broken = bytearray(data); broken[100] ^= 0x01
          open('bootblock-bad.bin', 'wb').write(broken)
          PY
          ./BootInfo bootblock.bin | tee bootinfo.txt
          grep -F 'DOS signature: yes' bootinfo.txt
          grep -F 'DOS type: 0' bootinfo.txt
          grep -F 'Checksum valid: yes' bootinfo.txt
          grep -F 'Root block: 880' bootinfo.txt
          grep -F 'trackdisk.device reference' bootinfo.txt
          grep -F 'exec.library reference' bootinfo.txt
          ./BootInfo --kv bootblock.bin | tee bootinfo-kv.txt
          grep -F 'checksum_valid=yes' bootinfo-kv.txt
          grep -F 'indicator_trackdisk=yes' bootinfo-kv.txt
          ./BootInfo bootblock-bad.bin | tee bootinfo-bad.txt
          grep -F 'Checksum valid: no' bootinfo-bad.txt
      - name: Exercise ResidentView host interface
        shell: bash
        run: |
          ./ResidentView | tee residentview.txt
          grep -F 'ResidentView snapshot' residentview.txt
          grep -F 'host-stub' residentview.txt
          ./ResidentView --kv | tee residentview-kv.txt
          grep -F 'tool=ResidentView' residentview-kv.txt
          grep -F 'record.0.kind=host-stub' residentview-kv.txt
          grep -F 'truncated=false' residentview-kv.txt
          ./ResidentView --kind residents | tee residents.txt
          grep -F 'host-resident-stub' residents.txt
          ./ResidentView --serve TEST.RESIDENTVIEW | tee serve.txt
          grep -F 'ResidentView ARexx host stub: TEST.RESIDENTVIEW' serve.txt
          grep -F 'PING=PONG' serve.txt
      - name: Exercise PatchView host interface
        shell: bash
        run: |
          ./PatchView --library exec.library --count 3 | tee patchview.txt
          grep -F 'PatchView library vectors: exec.library' patchview.txt
          grep -F 'LVO    -6' patchview.txt
          grep -F 'JMP' patchview.txt
          ./PatchView --kv --library dos.library --count 2 | tee patchview-kv.txt
          grep -F 'tool=PatchView' patchview-kv.txt
          grep -F 'kind=library' patchview-kv.txt
          grep -F 'library=dos.library' patchview-kv.txt
          grep -F 'record.0.lvo=-6' patchview-kv.txt
          grep -F 'record.0.direct_jmp=true' patchview-kv.txt
          grep -E '^vector_crc32=[0-9A-F]{8}$' patchview-kv.txt
          grep -F 'record_count=2' patchview-kv.txt
          ./PatchView --kv --device trackdisk.device --unit 0 --count 2 | tee patchview-device-kv.txt
          grep -F 'tool=PatchView' patchview-device-kv.txt
          grep -F 'kind=device' patchview-device-kv.txt
          grep -F 'device=trackdisk.device' patchview-device-kv.txt
          grep -F 'unit=0' patchview-device-kv.txt
          grep -F 'record_count=2' patchview-device-kv.txt
      - name: Exercise TaskView host interface
        shell: bash
        run: |
          ./TaskView | tee taskview.txt
          grep -F 'TaskView task snapshot' taskview.txt
          grep -F 'current' taskview.txt
          grep -F 'ready.example' taskview.txt
          grep -F 'wait.example' taskview.txt
          ./TaskView --kv --state ready | tee taskview-kv.txt
          grep -F 'tool=TaskView' taskview-kv.txt
          grep -F 'filter_state=ready' taskview-kv.txt
          grep -F 'record.0.state=ready' taskview-kv.txt
          grep -F 'record.0.name=ready.example' taskview-kv.txt
          grep -F 'record_count=1' taskview-kv.txt
          grep -F 'truncated=false' taskview-kv.txt
