name: M6.1 Compare qualification

on:
  push:
    branches: [main]
    paths:
      - 'src/compare.c'
      - 'tools/qualify_m6_1.py'
      - '.github/workflows/m6-1-compare.yml'
      - 'Makefile'
  pull_request:
    paths:
      - 'src/compare.c'
      - 'tools/qualify_m6_1.py'
      - '.github/workflows/m6-1-compare.yml'
      - 'Makefile'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M6.1 Compare
        run: python3 tools/qualify_m6_1.py
