name: M7.2 integrated qualification

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "rexx/**"
      - "workstation/**"
      - "tools/**"
      - "docs/RELEASE_v0.1.0.md"
      - "Makefile"
      - ".github/workflows/m7-2-integrated.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run M7.2 integrated qualification
        run: python3 tools/qualify_m7_2.py

      - name: Record package checksums
        shell: bash
        run: |
          mkdir -p build/m7-2
          sha256sum dist/AmiForensics-v0.1.0.tar.gz | tee build/m7-2/SHA256SUMS
          file dist/AmiForensics-v0.1.0.tar.gz | tee build/m7-2/package-file.txt

      - name: Upload M7.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-2-integrated-qualification
          path: |
            dist/AmiForensics-v0.1.0.tar.gz
            build/m7-2/SHA256SUMS
            build/m7-2/package-file.txt
