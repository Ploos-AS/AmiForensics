name: M2.1c ResidentView qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residentview-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip

      - name: Gate 1 - native ResidentView build with pinned Bebbo toolchain
        run: bash ci/fs-uae/build-native.sh

      - name: Gate 2 - execute ResidentView residents snapshot inside AROS guest
        run: bash ci/fs-uae/run-aros-residentview.sh

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-1c-residentview-qualification
          path: |
            build/fs-uae/native/ResidentView
            build/fs-uae/native/ResidentView.sha256
            build/fs-uae/native/file.txt
            build/fs-uae/native/result.txt
            build/fs-uae/native/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-guest/result.txt
            build/fs-uae/aros-guest/fs-uae.log
            build/fs-uae/aros-guest/fs-uae-version.txt
            build/fs-uae/aros-guest/aros-guest.fs-uae
          if-no-files-found: warn
