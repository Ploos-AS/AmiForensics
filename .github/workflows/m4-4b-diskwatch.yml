name: M4.4b DiskWatch qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  diskwatch-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip
      - name: Gate 1 - native DiskWatch build with pinned Bebbo toolchain
        run: bash ci/fs-uae/build-native-diskwatch.sh
      - name: Gate 2 - host DiskWatch contract
        shell: bash
        run: |
          make clean
          make CC=gcc CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-function' DiskWatch
          ./DiskWatch --kv --samples 4 --interval 1 | tee host-diskwatch.txt
          grep -F 'tool=DiskWatch' host-diskwatch.txt
          grep -F 'schema=amiforensics.trace.kv/1' host-diskwatch.txt
          grep -F 'mode=disk-change-watch' host-diskwatch.txt
          grep -F 'hooking=false' host-diskwatch.txt
          grep -F 'observation=TD_CHANGENUM' host-diskwatch.txt
          grep -F 'device=trackdisk.device' host-diskwatch.txt
          grep -F 'unit=0' host-diskwatch.txt
          grep -F 'samples_requested=4' host-diskwatch.txt
          grep -F 'interval_ticks=1' host-diskwatch.txt
          grep -F 'initial_change=7' host-diskwatch.txt
          grep -F 'final_change=8' host-diskwatch.txt
          grep -F 'record.0.kind=event' host-diskwatch.txt
          grep -F 'record.0.event=disk-change-number-changed' host-diskwatch.txt
          grep -F 'record.0.previous_change=7' host-diskwatch.txt
          grep -F 'record.0.current_change=8' host-diskwatch.txt
          grep -F 'record_count=1' host-diskwatch.txt
          grep -F 'truncated=false' host-diskwatch.txt
          ! ./DiskWatch --samples 1
          ! ./DiskWatch --samples 33
          ! ./DiskWatch --interval 0
          ! ./DiskWatch --interval 101
      - name: Gate 3 - execute DiskWatch in AROS guest
        run: bash ci/fs-uae/run-aros-diskwatch.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m4-4b-diskwatch-qualification
          path: |
            build/fs-uae/native-diskwatch/DiskWatch
            build/fs-uae/native-diskwatch/DiskWatch.sha256
            build/fs-uae/native-diskwatch/file.txt
            build/fs-uae/native-diskwatch/result.txt
            build/fs-uae/native-diskwatch/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-diskwatch/result.txt
            build/fs-uae/aros-diskwatch/fs-uae.log
            build/fs-uae/aros-diskwatch/fs-uae-version.txt
            build/fs-uae/aros-diskwatch/aros-diskwatch.fs-uae
            host-diskwatch.txt
