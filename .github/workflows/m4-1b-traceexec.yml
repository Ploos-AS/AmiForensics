name: M4.1b TraceExec qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  traceexec-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip
      - name: Gate 1 - native TraceExec build with pinned Bebbo toolchain
        run: bash ci/fs-uae/build-native-traceexec.sh
      - name: Gate 2 - host TraceExec foundation contract
        shell: bash
        run: |
          make clean
          make CC=gcc CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-function' TraceExec
          ./TraceExec --kv | tee host-traceexec.txt
          grep -F 'tool=TraceExec' host-traceexec.txt
          grep -F 'schema=amiforensics.trace.kv/1' host-traceexec.txt
          grep -F 'mode=event-observation' host-traceexec.txt
          grep -F 'hooking=false' host-traceexec.txt
          grep -F 'record.0.kind=event' host-traceexec.txt
          grep -F 'record.0.event=snapshot-task' host-traceexec.txt
          grep -F 'record.0.name=TraceExec-host-stub' host-traceexec.txt
          grep -F 'record.1.event=observation' host-traceexec.txt
          grep -F 'record_count=2' host-traceexec.txt
          grep -F 'truncated=false' host-traceexec.txt
          ! ./TraceExec --unknown
      - name: Gate 3 - execute TraceExec in AROS guest
        run: bash ci/fs-uae/run-aros-traceexec.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-1b-traceexec-qualification
          path: |
            build/fs-uae/native-traceexec/TraceExec
            build/fs-uae/native-traceexec/TraceExec.sha256
            build/fs-uae/native-traceexec/file.txt
            build/fs-uae/native-traceexec/result.txt
            build/fs-uae/native-traceexec/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-traceexec/result.txt
            build/fs-uae/aros-traceexec/fs-uae.log
            build/fs-uae/aros-traceexec/fs-uae-version.txt
            build/fs-uae/aros-traceexec/aros-traceexec.fs-uae
            host-traceexec.txt
