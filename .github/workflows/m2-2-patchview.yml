name: M2.2 PatchView qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patchview-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip

      - name: Gate 1 - native PatchView build with pinned Bebbo toolchain
        run: bash ci/fs-uae/build-native-patchview.sh

      - name: Gate 2 - execute PatchView in AROS guest
        run: bash ci/fs-uae/run-aros-patchview.sh

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-2-patchview-qualification
          path: |
            build/fs-uae/native-patchview/PatchView
            build/fs-uae/native-patchview/PatchView.sha256
            build/fs-uae/native-patchview/file.txt
            build/fs-uae/native-patchview/result.txt
            build/fs-uae/native-patchview/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-patchview/result.txt
            build/fs-uae/aros-patchview/fs-uae.log
            build/fs-uae/aros-patchview/fs-uae-version.txt
            build/fs-uae/aros-patchview/aros-patchview.fs-uae
          if-no-files-found: warn
