name: M2.3b TaskView qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  taskview-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip
      - name: Gate 1 - native TaskView build with pinned Bebbo toolchain
        run: bash ci/fs-uae/build-native-taskview.sh
      - name: Gate 2 - execute TaskView in AROS guest
        run: bash ci/fs-uae/run-aros-taskview.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-3b-taskview-qualification
          path: |
            build/fs-uae/native-taskview/TaskView
            build/fs-uae/native-taskview/TaskView.sha256
            build/fs-uae/native-taskview/file.txt
            build/fs-uae/native-taskview/result.txt
            build/fs-uae/native-taskview/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-taskview/result.txt
            build/fs-uae/aros-taskview/fs-uae.log
            build/fs-uae/aros-taskview/fs-uae-version.txt
            build/fs-uae/aros-taskview/aros-taskview.fs-uae
