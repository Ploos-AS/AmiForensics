name: M3.3b MemScan resident signature scan qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  resident-signature-scan-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip
      - name: Gate 1 - native MemScan build with pinned Bebbo toolchain
        run: bash ci/fs-uae/build-native-memscan.sh
      - name: Gate 2 - host bounded resident scan contract
        shell: bash
        run: |
          make clean
          make CC=gcc CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-function' MemScan
          set +e
          ./MemScan --kv --scan-residents | tee host-resident-scan.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0
          grep -F 'tool=MemScan' host-resident-scan.txt
          grep -F 'schema=amiforensics.snapshot.kv/1' host-resident-scan.txt
          grep -F 'mode=resident-signature-scan' host-resident-scan.txt
          grep -F 'scan_source=memheader-bounded' host-resident-scan.txt
          grep -F 'scan_region_limit=65536' host-resident-scan.txt
          grep -F 'scan_total_limit=262144' host-resident-scan.txt
          grep -F 'record.0.kind=resident-candidate' host-resident-scan.txt
          grep -F 'record.0.matchword_valid=true' host-resident-scan.txt
          grep -F 'record.0.self_match_valid=true' host-resident-scan.txt
          grep -F 'record.0.endskip_valid=true' host-resident-scan.txt
          grep -F 'record.0.registered_resmodule=false' host-resident-scan.txt
          grep -F 'record_count=1' host-resident-scan.txt
          grep -F 'scan_bytes=128' host-resident-scan.txt
          grep -F 'scan_limited=false' host-resident-scan.txt
          grep -F 'truncated=false' host-resident-scan.txt
          ! ./MemScan --scan-residents --discover-residents
          ! ./MemScan --scan-residents --suspicious
      - name: Gate 3 - execute bounded resident scan in AROS guest
        run: bash ci/fs-uae/run-aros-memscan-signatures.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-3b-resident-signature-scan-qualification
          path: |
            build/fs-uae/native-memscan/MemScan
            build/fs-uae/native-memscan/MemScan.sha256
            build/fs-uae/native-memscan/file.txt
            build/fs-uae/native-memscan/result.txt
            build/fs-uae/native-memscan/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-memscan-signatures/result.txt
            build/fs-uae/aros-memscan-signatures/fs-uae.log
            build/fs-uae/aros-memscan-signatures/fs-uae-version.txt
            build/fs-uae/aros-memscan-signatures/aros-memscan-signatures.fs-uae
            host-resident-scan.txt
